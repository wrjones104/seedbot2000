# nginx site for seedbot.net, port 80 (Debian/Ubuntu nginx package).
# Install as /etc/nginx/sites-available/seedbot.net-http and symlink into
# sites-enabled. Enable this one on its own first: it serves the ACME challenge
# Certbot needs to issue the certificate that seedbot.net.conf uses.
# See deploy/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name seedbot.net www.seedbot.net;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://seedbot.net$request_uri;
    }
}

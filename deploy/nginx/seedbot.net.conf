# nginx site for seedbot.net, HTTPS (Debian/Ubuntu nginx package).
# Install as /etc/nginx/sites-available/seedbot.net and symlink into
# sites-enabled, after Certbot has issued the certificate (see deploy/DEPLOY.md).
# The port 80 side lives in seedbot.net-http.conf. Protocols and ciphers come
# from the ssl_* defaults in /etc/nginx/nginx.conf.
#
# Paths assume the app lives in /var/www/seedbot_project (BASE_DIR) and
# www-data is in the seedbot group so it can read staticfiles/ and data/seeds/.

# HTTPS www -> apex. ALLOWED_HOSTS accepts both, but one canonical host keeps
# links and Discord OAuth on seedbot.net.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.seedbot.net;
    ssl_certificate /etc/letsencrypt/live/seedbot.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seedbot.net/privkey.pem;

    return 301 https://seedbot.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seedbot.net;
    ssl_certificate /etc/letsencrypt/live/seedbot.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seedbot.net/privkey.pem;

    access_log /var/log/nginx/seedbot.access.log;
    error_log /var/log/nginx/seedbot.error.log;

    # Tune-Up uploads a whole ROM (a few MB); nginx's default limit is 1 MB.
    client_max_body_size 16m;

    # collectstatic output (STATIC_ROOT).
    location /static/ {
        alias /var/www/seedbot_project/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Uploaded ROMs wait here for the tune-up task. They are user-supplied
    # copies of a commercial ROM and must never be downloadable.
    location /media/temp_roms/ {
        return 404;
    }

    # Generated seed zips (MEDIA_ROOT). Django only serves these when DEBUG is on.
    location /media/ {
        alias /var/www/seedbot_project/data/seeds/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django trusts this header when TRUST_X_FORWARDED_PROTO is set in .env, to
        # know the request was HTTPS; without it CSRF and the Discord OAuth callback break.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}

# nginx site for seedbot.net on the shared AP Alerts VM (nginx 1.22, Debian 12).
# Install as /etc/nginx/sites-available/seedbot.net and symlink into sites-enabled.
# AP Alerts' own server blocks (archipelagoalerts.com, ap-alerts.seedbot.net) are
# untouched; nginx picks the block by server_name.
#
# TLS comes from a snippet so the cert can be switched without Certbot editing
# this file. /etc/nginx/snippets/seedbot-tls.conf is a symlink to one of:
#   seedbot-tls-copied.conf       - cert copied from the old VM (before DNS moves)
#   seedbot-tls-letsencrypt.conf  - cert issued on this VM (after DNS moves)
# See deploy/MIGRATION.md.
#
# Paths assume the app lives in /srv/seedbot (BASE_DIR) and www-data is in the
# seedbot group so it can read staticfiles/ and data/seeds/.

# HTTP: ACME challenges for renewal, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name seedbot.net www.seedbot.net;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://seedbot.net$request_uri;
    }
}

# HTTPS www -> apex. ALLOWED_HOSTS accepts both, but one canonical host keeps
# links and Discord OAuth on seedbot.net.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.seedbot.net;
    include /etc/nginx/snippets/seedbot-tls.conf;

    return 301 https://seedbot.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seedbot.net;
    include /etc/nginx/snippets/seedbot-tls.conf;

    access_log /var/log/nginx/seedbot.access.log;
    error_log /var/log/nginx/seedbot.error.log;

    # Tune-Up uploads a whole ROM (a few MB); nginx's default limit is 1 MB.
    client_max_body_size 16m;

    # collectstatic output (STATIC_ROOT).
    location /static/ {
        alias /srv/seedbot/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Uploaded ROMs wait here for the tune-up task. They are user-supplied
    # copies of a commercial ROM and must never be downloadable.
    location /media/temp_roms/ {
        return 404;
    }

    # Generated seed zips (MEDIA_ROOT). Django only serves these when DEBUG is on.
    location /media/ {
        alias /srv/seedbot/data/seeds/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django trusts this header in prod (SECURE_PROXY_SSL_HEADER) to know the
        # request was HTTPS; without it CSRF and the Discord OAuth callback break.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}

# Permanent: the certificate issued on this VM with
#   certbot certonly --webroot -w /var/www/letsencrypt -d seedbot.net -d www.seedbot.net
# Install in /etc/nginx/snippets/.
ssl_certificate /etc/letsencrypt/live/seedbot.net/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/seedbot.net/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

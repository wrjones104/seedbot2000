# Temporary: the seedbot.net certificate copied from the old SeedBot VM, used to
# test over HTTPS with a hosts-file override and to serve the first minutes after
# the DNS change. Install in /etc/nginx/snippets/. Delete once the Let's Encrypt
# snippet is live.
ssl_certificate /etc/ssl/seedbot-copied/fullchain.pem;
ssl_certificate_key /etc/ssl/seedbot-copied/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
